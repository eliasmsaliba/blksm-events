backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

site_url: https://blksm.events
display_url: https://blksm.events
logo_url: /assets/logo.svg

collections:
  - name: "home"
    label: "Homepage Text"
    files:
      - name: "home"
        label: "Homepage Content"
        file: "content/home.json"
        fields:
          - { label: "Hero — Eyebrow line", name: "heroEyebrow", widget: "string" }
          - { label: "Hero — Title line 1", name: "heroLine1", widget: "string" }
          - { label: "Hero — Title line 2", name: "heroLine2", widget: "string" }
          - { label: "Hero — Title line 3 (highlighted)", name: "heroLine3", widget: "string" }
          - { label: "Hero — Subtext", name: "heroSub", widget: "text" }
          - { label: "About — Lead sentence", name: "aboutLead", widget: "text" }
          - { label: "About — Paragraph 1", name: "aboutCopy1", widget: "text" }
          - { label: "About — Paragraph 2", name: "aboutCopy2", widget: "text" }
          - { label: "Contact — Title line 1", name: "contactTitle1", widget: "string" }
          - { label: "Contact — Title line 2 (highlighted)", name: "contactTitle2", widget: "string" }
          - { label: "Contact — Blurb", name: "contactBlurb", widget: "text" }

  - name: "team"
    label: "Team Members"
    files:
      - name: "team"
        label: "Team Roster"
        file: "content/team.json"
        fields:
          - label: "Members"
            name: "members"
            widget: "list"
            summary: "{{name}} — {{role}}"
            fields:
              - { label: "Full Name", name: "name", widget: "string" }
              - { label: "Role / Title", name: "role", widget: "string" }
              - { label: "Department", name: "department", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image", required: false }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string", required: false }
              - { label: "Short Bio (shown on team grid card)", name: "bio", widget: "text" }
              - { label: "Full Bio (shown on their profile page)", name: "details", widget: "text" }
              - { label: "URL Slug (no spaces, e.g. jane-doe)", name: "id", widget: "string", hint: "Used in the web address for this person's profile page. Lowercase, hyphens only, no spaces." }

  - name: "portfolio"
    label: "Portfolio Projects"
    files:
      - name: "portfolio"
        label: "Portfolio Projects"
        file: "content/portfolio.json"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{title}} — {{categoryLabel}}"
            fields:
              - { label: "Project Title", name: "title", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Festival", value: "festival" }
                  - { label: "Club Nights", value: "club-nights" }
                  - { label: "Entertainment", value: "entertainment" }
                  - { label: "Date Nights", value: "date-nights" }
                  - { label: "Sports", value: "sports" }
                  - { label: "Corporate", value: "corporate" }
                  - { label: "Cultural", value: "cultural" }
              - { label: "Category Label (shown on the badge)", name: "categoryLabel", widget: "string" }
              - { label: "Cover Image", name: "image", widget: "image", required: false, hint: "Optional — leave blank to use a brand gradient instead of a photo." }
              - { label: "Short Summary (shown on the portfolio grid card)", name: "summary", widget: "text" }
              - { label: "Full Details (shown on the project page)", name: "details", widget: "text", required: false }
              - { label: "Gallery Photos (shown on the project page)", name: "gallery", widget: "list", field: { label: "Photo", name: "image", widget: "image" }, required: false }
              - { label: "Next Event (optional, free text e.g. '15 August 2026 — Johannesburg')", name: "nextEvent", widget: "string", required: false }
              - { label: "URL Slug", name: "id", widget: "string", hint: "Lowercase, hyphens only, no spaces." }

  - name: "events"
    label: "Events Calendar"
    files:
      - name: "events"
        label: "Events"
        file: "content/events.json"
        fields:
          - label: "Events"
            name: "events"
            widget: "list"
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "Event Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { label: "Time (optional)", name: "time", widget: "string", required: false, hint: "e.g. 20:00" }
              - { label: "Venue", name: "venue", widget: "string", required: false }
              - { label: "City", name: "city", widget: "string", required: false }
              - label: "Category"
                name: "category"
                widget: "select"
                required: false
                options:
                  - { label: "Festival", value: "festival" }
                  - { label: "Club Nights", value: "club-nights" }
                  - { label: "Entertainment", value: "entertainment" }
                  - { label: "Date Nights", value: "date-nights" }
                  - { label: "Sports", value: "sports" }
                  - { label: "Corporate", value: "corporate" }
                  - { label: "Cultural", value: "cultural" }
              - { label: "Category Label", name: "categoryLabel", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Cover Image", name: "image", widget: "image", required: false }
              - { label: "Gallery Photos (shown on the event detail page)", name: "gallery", widget: "list", field: { label: "Photo", name: "image", widget: "image" }, required: false }
              - { label: "Ticket / More Info Link", name: "ticketLink", widget: "string", required: false }
              - { label: "URL Slug", name: "id", widget: "string", hint: "Lowercase, hyphens only, no spaces." }
              - { label: "Enable Registration Form", name: "registrationEnabled", widget: "boolean", default: false, hint: "Turns on a sign-up form on this event's page. Submissions are emailed to you and viewable in the Netlify dashboard." }
              - { label: "Registration Button Label", name: "registrationButtonLabel", widget: "string", required: false, default: "Register Now", hint: "Optional — defaults to 'Register Now'." }
              - { label: "Use a Saved Form Template (optional)", name: "registrationTemplate", widget: "string", required: false, hint: "Type the exact ID of a template from the 'Form Templates' section (e.g. 'standard-rsvp') to reuse a form you've already built — saves rebuilding the same fields every time. Leave blank to build a one-off form below instead." }
              - label: "Registration Form Fields (ignored if a Template is set above)"
                name: "registrationFields"
                widget: "list"
                required: false
                summary: "{{label}} ({{type}})"
                hint: "Build the form by adding one entry per question you want to ask."
                fields:
                  - { label: "Field Label (what the guest sees)", name: "label", widget: "string" }
                  - label: "Field Type"
                    name: "type"
                    widget: "select"
                    default: "text"
                    options:
                      - { label: "Short Text", value: "text" }
                      - { label: "Email Address", value: "email" }
                      - { label: "Phone Number", value: "tel" }
                      - { label: "Number", value: "number" }
                      - { label: "Date", value: "date" }
                      - { label: "File Upload", value: "file" }
                      - { label: "Long Text / Message", value: "textarea" }
                      - { label: "Dropdown", value: "select" }
                      - { label: "Radio Buttons (pick one)", value: "radio" }
                      - { label: "Checkboxes (pick any number)", value: "checkbox" }
                  - { label: "Options (for Dropdown, Radio, or Checkboxes — one per line. Leave blank on Checkboxes for a single yes/no checkbox.)", name: "options", widget: "text", required: false }
                  - { label: "Allow Multiple Files? (only used if Field Type is File Upload)", name: "multiple", widget: "boolean", default: false, required: false }
                  - { label: "Required?", name: "required", widget: "boolean", default: true }
                  - label: "Width"
                    name: "width"
                    widget: "select"
                    default: "full"
                    required: false
                    hint: "Two consecutive 'Half' fields sit side by side as a row."
                    options:
                      - { label: "Full Width", value: "full" }
                      - { label: "Half Width", value: "half" }

  - name: "menu"
    label: "Site Navigation"
    files:
      - name: "menu"
        label: "Menu Links"
        file: "content/menu.json"
        fields:
          - label: "Menu Items"
            name: "items"
            widget: "list"
            summary: "{{label}}"
            hint: "Drag to reorder. These links appear in the navigation bar on every page, in this order."
            fields:
              - { label: "Label (what visitors see)", name: "label", widget: "string" }
              - label: "Link"
                name: "href"
                widget: "string"
                required: false
                hint: "Examples — section on homepage: index.html#about · another page: team.html or events.html · a custom page: custom-page.html?slug=your-slug · external site: https://example.com. Leave blank if this item only opens a submenu."
              - { label: "Show as a highlighted button (like Contact)?", name: "isButton", widget: "boolean", default: false, required: false }
              - label: "Submenu Items (optional — turns this into a dropdown)"
                name: "children"
                widget: "list"
                required: false
                summary: "{{label}}"
                hint: "Add items here to show a dropdown under this menu link."
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Link", name: "href", widget: "string" }

  - name: "pages"
    label: "Custom Pages"
    files:
      - name: "pages"
        label: "Custom Pages"
        file: "content/pages.json"
        fields:
          - label: "Pages"
            name: "pages"
            widget: "list"
            summary: "{{title}}"
            hint: "Each page here works just like Team or Portfolio — a grid of items, each with its own detail page. Link to one from the menu using custom-page.html?slug=your-slug."
            fields:
              - { label: "URL Slug", name: "slug", widget: "string", hint: "Lowercase, hyphens only, no spaces — e.g. 'sponsors' or 'venues'." }
              - { label: "Menu Label", name: "navLabel", widget: "string", required: false, hint: "Optional label to use if you link this page from the menu." }
              - { label: "Page Title", name: "title", widget: "string" }
              - { label: "Eyebrow (small text above the title)", name: "eyebrow", widget: "string", required: false }
              - { label: "Intro Text", name: "intro", widget: "text", required: false }
              - { label: "Item Label (singular, e.g. 'Sponsor', 'Venue', 'Partner')", name: "itemLabelSingular", widget: "string", required: false, default: "Item" }
              - label: "Items"
                name: "items"
                widget: "list"
                summary: "{{title}}"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Cover Image", name: "image", widget: "image", required: false }
                  - { label: "Short Summary (shown on the grid card)", name: "summary", widget: "text", required: false }
                  - { label: "Full Details (shown on the item's page)", name: "details", widget: "text", required: false }
                  - { label: "Gallery Photos", name: "gallery", widget: "list", field: { label: "Photo", name: "image", widget: "image" }, required: false }
                  - { label: "URL Slug", name: "id", widget: "string", hint: "Lowercase, hyphens only, no spaces." }

  - name: "partners"
    label: "Partners & Sponsors"
    files:
      - name: "partners"
        label: "Logo Carousel"
        file: "content/partners.json"
        fields:
          - { label: "Section Heading", name: "heading", widget: "string", default: "Our Partners" }
          - { label: "Subtext (optional)", name: "subtext", widget: "string", required: false, hint: "Optional line shown under the heading." }
          - label: "Show on Pages"
            name: "pages"
            widget: "select"
            multiple: true
            required: false
            hint: "Tick every page where the logo carousel should appear."
            options:
              - { label: "Home", value: "home" }
              - { label: "Team", value: "team" }
              - { label: "Portfolio", value: "portfolio" }
              - { label: "Events", value: "events" }
          - label: "Logos"
            name: "logos"
            widget: "list"
            summary: "{{name}}"
            hint: "Add one entry per logo. Logos scroll automatically in a carousel."
            fields:
              - { label: "Name (for your reference)", name: "name", widget: "string" }
              - { label: "Logo Image", name: "image", widget: "image" }
              - { label: "Link URL (where clicking the logo goes)", name: "url", widget: "string", required: false, hint: "e.g. https://example.com" }

  - name: "formTemplates"
    label: "Form Templates"
    files:
      - name: "formTemplates"
        label: "Form Templates"
        file: "content/form-templates.json"
        fields:
          - label: "Templates"
            name: "templates"
            widget: "list"
            summary: "{{name}}"
            hint: "Build a registration form once here, then reuse it on any event by typing its ID into that event's 'Use a Saved Form Template' field. Editing a template here updates every event using it."
            fields:
              - { label: "Template ID (lowercase, hyphens only, no spaces — e.g. 'standard-rsvp')", name: "id", widget: "string" }
              - { label: "Template Name (for your own reference)", name: "name", widget: "string" }
              - label: "Fields"
                name: "fields"
                widget: "list"
                summary: "{{label}} ({{type}})"
                fields:
                  - { label: "Field Label (what the guest sees)", name: "label", widget: "string" }
                  - label: "Field Type"
                    name: "type"
                    widget: "select"
                    default: "text"
                    options:
                      - { label: "Short Text", value: "text" }
                      - { label: "Email Address", value: "email" }
                      - { label: "Phone Number", value: "tel" }
                      - { label: "Number", value: "number" }
                      - { label: "Date", value: "date" }
                      - { label: "File Upload", value: "file" }
                      - { label: "Long Text / Message", value: "textarea" }
                      - { label: "Dropdown", value: "select" }
                      - { label: "Radio Buttons (pick one)", value: "radio" }
                      - { label: "Checkboxes (pick any number)", value: "checkbox" }
                  - { label: "Options (for Dropdown, Radio, or Checkboxes — one per line. Leave blank on Checkboxes for a single yes/no checkbox.)", name: "options", widget: "text", required: false }
                  - { label: "Allow Multiple Files? (only used if Field Type is File Upload)", name: "multiple", widget: "boolean", default: false, required: false }
                  - { label: "Required?", name: "required", widget: "boolean", default: true }
                  - label: "Width"
                    name: "width"
                    widget: "select"
                    default: "full"
                    required: false
                    hint: "Two consecutive 'Half' fields sit side by side as a row."
                    options:
                      - { label: "Full Width", value: "full" }
                      - { label: "Half Width", value: "half" }
