<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event — BLKSM Events</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="noise"></div>
<div class="cursor-glow" id="cursorGlow"></div>

<nav id="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo"><img src="assets/logo.svg" alt="BLKSM Events" class="logo-img"></a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu"><span></span><span></span><span></span></button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#process">Process</a></li>
      <li><a href="index.html#departments">Departments</a></li>
      <li><a href="team.html">Team</a></li>
      <li><a href="portfolio.html">Portfolio</a></li>
      <li><a href="events.html" class="active">Events</a></li>
      <li><a href="index.html#contact" class="nav-cta">Contact</a></li>
    </ul>
  </div>
</nav>

<header class="hero hero-sub-page member-hero">
  <div class="hero-bg">
    <div class="cine-beam"></div>
    <div class="cine-beam2"></div>
    <div class="cine-vignette"></div>
  </div>
  <div class="hero-content" id="eventHero">
    <!-- populated by script.js -->
  </div>
</header>

<section class="section member-detail">
  <div class="container" id="eventDetail">
    <!-- populated by script.js -->
  </div>
</section>

<section class="section registration" id="registrationSection" hidden>
  <div class="container">
    <div class="section-tag">Reserve Your Spot</div>
    <h2 class="section-title" id="registrationTitle">Register for This Event</h2>
    <div id="registrationFormHost"></div>
  </div>
</section>

<!--
  Static stub form so Netlify's build-time scanner registers the "event-registration"
  form name. The real, dynamically-built form (rendered by script.js) submits to this
  same form name via fetch — Netlify accepts whatever fields are POSTed once the name
  is registered, even ones not listed below.
-->
<form name="event-registration" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="tel" name="phone" />
  <input type="text" name="event" />
  <textarea name="message"></textarea>
</form>

<section class="section why team-culture">
  <div class="container">
    <div class="section-tag">What Else Is On</div>
    <h2 class="section-title">Back to the <span class="accent">Events Calendar</span></h2>
    <a href="events.html" class="btn btn-primary">View All Events</a>
  </div>
</section>

<footer class="footer">
  <div class="container footer-inner">
    <a href="index.html" class="logo"><img src="assets/logo.svg" alt="BLKSM Events" class="logo-img"></a>
    <div class="footer-links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms &amp; Conditions</a>
    </div>
    <p>&copy; <span id="year"></span> BLKSM Events. All rights reserved.</p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
